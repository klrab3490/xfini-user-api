services:
  xfini-user-api:
    build: .
    ports:
      - "5677:3001"
    env_file:
      - .env
    volumes:
      - ./serviceAccount.json:/app/serviceAccount.json:ro
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - xfini-user-api
    restart: unless-stopped

volumes:
  n8n_data:
